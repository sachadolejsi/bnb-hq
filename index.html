<!doctype html>
<html lang="en">
<head>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:300;background:#1F4D3A;color:#fff;display:grid;place-items:center;padding:24px 16px;--logo-ink:#FFFFFF;--logo-cut:#1F4D3A}
.gate-btn{border:0;border-radius:999px;background:#fff;color:#1F4D3A;font:600 1rem system-ui,sans-serif;padding:14px 26px;cursor:pointer;margin-top:6px}
.gate-btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
</style>
<title>B&amp;B CO. HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: top bar + single working column; bottom tab bar on phones. Lawn-green accent on cool sage neutrals. */
:root{
  --bg:#F2F4F2; --surface:#FFFFFF; --surface-2:#E8EDEA; --ink:#13221B; --muted:#5A675F; --line:#D6DDD8;
  --accent:#1F4D3A; --accent-ink:#FFFFFF; --accent-soft:#DDE9E2;
  --logo-ink:#1F4D3A; --logo-cut:#FFFFFF;
  --gold:#B08A2E; --gold-bright:#C9A54C; --hero-bg:#1F4D3A; --hero-ink:#FFFFFF;
  --warn:#A5560C; --warn-soft:#F8E5D0; --bad:#AE3A2C; --bad-soft:#F6DAD5; --good:#1F6B4A;
  --c-mow:#1F4D3A; --c-proj:#C9A54C; --c-exp:#A4462F;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1612; --surface:#14201A; --surface-2:#1C2B23; --ink:#E7ECE8; --muted:#9BA89F; --line:#26362D;
  --accent:#6DB28E; --accent-ink:#0B1A12; --accent-soft:#1B3328;
  --logo-ink:#FFFFFF; --logo-cut:#14201A;
  --gold:#D9B95E; --gold-bright:#D9B95E; --hero-bg:#1F4D3A; --hero-ink:#FFFFFF;
  --warn:#E89A50; --warn-soft:#3B2614; --bad:#EC7F72; --bad-soft:#3D1F1A; --good:#6DB28E;
  --c-mow:#3F8A66; --c-proj:#D9B95E; --c-exp:#E07A5F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#14201A; --surface-2:#1C2B23; --ink:#E7ECE8; --muted:#9BA89F; --line:#26362D;
  --accent:#6DB28E; --accent-ink:#0B1A12; --accent-soft:#1B3328;
  --logo-ink:#FFFFFF; --logo-cut:#14201A;
  --gold:#D9B95E; --gold-bright:#D9B95E; --hero-bg:#1F4D3A; --hero-ink:#FFFFFF;
  --warn:#E89A50; --warn-soft:#3B2614; --bad:#EC7F72; --bad-soft:#3D1F1A; --good:#6DB28E;
  --c-mow:#3F8A66; --c-proj:#D9B95E; --c-exp:#E07A5F; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.brand-mark{width:39px;height:35px;display:block;flex:none}.brand-mark svg{width:100%;height:100%;display:block}
.brand small{color:var(--gold)!important;font-weight:700!important;letter-spacing:.08em}
.brand small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem;margin-left:2px}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:7px}
.nav button svg{width:17px;height:17px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.more-btn{display:none!important}
@media (max-width:1120px) and (min-width:821px){.nav button{padding:8px 9px;font-size:.84rem}.nav button svg{display:none}}
.gear{border:1px solid var(--line);background:none;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.gear[aria-current="page"]{color:var(--accent);border-color:var(--accent)}

#vshell,#vbody{display:grid;gap:18px;min-width:0}
main{max-width:1180px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.vhead h2{margin-right:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar > *{min-width:0}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp, select.inp, textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar .inp{width:auto}
.search{min-width:180px;flex:1 1 200px;max-width:320px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3{margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.panel > h3 .muted{font-family:var(--f-body);font-weight:500;font-size:.85rem;margin-left:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:520px){.kpi.hero{grid-column:1/-1}.kpi .v{font-size:1.4rem}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.kpi.hero{background:var(--hero-bg);border-color:var(--hero-bg);color:var(--hero-ink)}
.kpi.hero .label{color:var(--gold-bright);opacity:1}
.kpi.hero .s{color:inherit;opacity:.82}
.kpi.hero .goal > div{background:var(--gold-bright)}
.kpi .s b{font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.kpi.hero .up,.kpi.hero .down{color:inherit}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* lists / tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.month-row td{background:var(--surface-2);font-weight:600;font-size:.82rem;padding:6px 10px}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem}
.bar-row .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:3px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* pills */
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.pill.green{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
button.pill{border:0;cursor:pointer}

/* week checklist */
.wk-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.wk-range{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress > div{height:100%;background:var(--accent);transition:width .3s}
.lawns{display:grid;gap:8px}
.lawn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;user-select:none}
.lawn:hover{border-color:var(--muted)}
.lawn .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.lawn.done{background:var(--accent-soft);border-color:transparent}
.lawn.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lawn .who{min-width:0}
.lawn .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lawn .who span{font-size:.82rem;color:var(--muted)}
.lawn .end{display:flex;align-items:center;gap:8px}
.lawn .price{font-weight:700;font-variant-numeric:tabular-nums}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:.9rem}
details.more .lawns{margin-top:10px}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,14,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:1.2rem;margin-right:auto}
.dlg .dlg{min-height:0;flex:1 1 auto}
.dlg-b{padding:16px 18px;overflow:auto;display:grid;gap:14px;min-height:0;flex:1 1 auto;align-content:start}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.dlg-f .sp{margin-right:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field.wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 70px 100px 90px 32px;gap:8px;align-items:center}
.item .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.items-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.totals{display:grid;justify-content:end;gap:4px;text-align:right}
.totals div{display:flex;gap:24px;justify-content:space-between}
.totals .grand{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;font-weight:600}
.msgbox{width:100%;min-height:150px}
.goal{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.goal > div{height:100%;background:currentColor}
.kpi:not(.hero) .goal{background:var(--surface-2)} .kpi:not(.hero) .goal > div{background:var(--accent)}
.receipt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.receipt img{max-height:90px;border-radius:6px;border:1px solid var(--line)}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.toast{display:flex;align-items:center;gap:14px}
.toast-undo{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 2px}
.state{padding:60px 16px;text-align:center;color:var(--muted)}
.state h2{color:var(--ink);margin-bottom:8px}

/* phone */
@media (max-width:820px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);flex-wrap:nowrap;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:25}
  .nav button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;flex:1;min-width:0}
  .nav button svg{width:21px;height:21px}
  .top-in{justify-content:space-between}
  main{padding-bottom:110px}
  .item{grid-template-columns:minmax(0,1fr) 56px 80px 28px}
  .item .tot{display:none}
  .hide-sm{display:none}
  .nav [data-sec]{display:none}
  .more-btn{display:flex!important}
  .lawn{padding:12px}
  .lawn .end .pill{padding:6px 11px;font-size:.78rem}
  .lawn .end .pill:not(button){display:none}
  .vhead .toolbar{width:100%}
}
#lock{position:fixed;inset:0;z-index:200;background:var(--hero-bg);color:#fff;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;--logo-ink:#FFFFFF;--logo-cut:#1F4D3A}
[hidden]{display:none!important}
.lock-in{display:grid;justify-items:center;gap:14px;width:min(320px,100%)}
.lock-logo{width:84px;height:75px}.lock-logo svg{width:100%;height:100%}
.lock-name{font-size:1.6rem;color:#fff}
.lock-msg{margin:0;color:#C9A54C;font-weight:600;min-height:1.4em;text-align:center}
.dots{display:flex;gap:16px;margin:4px 0 10px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}.dots i.on{background:#fff;border-color:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.keypad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:1.6rem;font-family:var(--f-display);font-weight:600;cursor:pointer}
.keypad button:active,.keypad button:hover{background:rgba(255,255,255,.24)}
.keypad button:disabled{opacity:.35}
.lock-help{font-size:.8rem;opacity:.7;text-align:center;margin:8px 0 0}
.pinrow{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.pinrow .field{width:150px}
@media (max-width:1240px) and (min-width:821px){.nav button{padding:8px 8px;font-size:.82rem}.nav button svg{display:none}}
.blk.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.blk.free:not(.done){border-style:dashed}
.pill.gold{background:color-mix(in srgb,var(--gold-bright) 20%,transparent);color:var(--gold)}
.habit{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.86rem;cursor:pointer}
.habit svg{width:14px;height:14px}.habit small{color:var(--muted);font-weight:600}
.habit.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.habit.on small{color:inherit;opacity:.8}
.bedit{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:92px 92px minmax(0,1fr) 110px 32px;gap:6px;align-items:center}
@media (max-width:620px){.brow{grid-template-columns:1fr 1fr 32px}.brow [data-bk="title"]{grid-column:1/-1;order:-1}.brow select{grid-column:1/3}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>


</head>
<body>

<script>

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const firstName = n => { const f = String(n || '').trim().split(/\s+/)[0]; return f && !/^\d/.test(f) ? f : 'there'; };
const FREQ = { weekly: 'Weekly', biweekly: 'Bi-weekly', monthly: 'Monthly plan', oncall: 'On call', none: 'Projects only' };
const PAY = { each: 'Pays each cut', monthend: 'Pays month-end for cuts', plan: 'Monthly plan' };

const EXP_CATS = ['Fuel','Labour','Supplies','Equipment','Equipment maintenance','Vehicle','Marketing','Insurance','Dump fees','Phone & software','Other'];
const DEFAULT_SERVICES = ['Lawn mowing','Spring cleanup','Fall cleanup','Garden cleanup','Weeding','Mulching','Hedge trimming','Bush removal','Tree removal','Pressure washing','Deck restoration','Fence staining','Pergola restoration','Landscape edging','Gravel pathway','Aeration + overseeding','Gutter cleaning','Snow removal'];
const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

// ---------- state ----------
const S = {
  db: null, readOnly: false,
  clients: {}, jobs: {}, weeks: {}, expenses: {}, quotes: {}, invoices: {}, crew: {}, shifts: {}, weekplans: {},
  settings: {}, loaded: new Set(),
  view: 'home', year: new Date().getFullYear(), weekStart: mondayOf(today()),
  f: { jobsQ: '', jobsMonth: 'all', jobsType: 'all', jobsPaid: 'all', clientsQ: '', clientsF: 'active', billTab: 'owed', billStatus: 'open', owedF: 'all', campaign: 'all', raisePct: 8, raiseRound: '5', raiseOnlyLow: false, billQ: '', costMonth: 'all' }
};
const settings = () => Object.assign({ businessName: 'B&B CO.', tagline: 'Home & property services', phone: '', email: '', address: '', hst: '', taxRate: 0, terms: 'Payment due on receipt. E-transfer or cash accepted.', etransfer: '', services: DEFAULT_SERVICES.join(', ') }, S.settings);

// ---------- persistence (one write at a time per document) ----------
const queues = {};
function save(path, data) {

// ---------- derived data ----------
function revenueEntries() {
  const out = [];
  for (const [id, j] of Object.entries(S.jobs)) out.push({ key: 'job:' + id, date: j.date, amount: Number(j.amount) || 0, paid: !!j.paid, kind: j.kind || 'project', clientId: j.clientId || '', clientName: j.clientName || '', address: j.address || '', service: j.service || '', invoiceId: j.invoiceId || '', src: { t: 'job', id } });
  for (const [w, doc] of Object.entries(S.weeks)) for (const [cid, e] of Object.entries(doc.entries || {})) out.push({ key: `mow:${w}:${cid}`, date: e.date || w, amount: Number(e.amount) || 0, paid: !!e.paid, kind: 'mow', clientId: cid, clientName: e.name || S.clients[cid]?.name || 'Client', address: e.address || S.clients[cid]?.address || '', service: e.front ? 'Lawn mowing (front only)' : 'Lawn mowing', front: !!e.front, invoiceId: e.invoiceId || '', src: { t: 'mow', w, cid } });
  return out;
}
const isMowKind = k => k === 'mow' || k === 'mow-import' || k === 'sub';
const yearOf = s => Number(String(s).slice(0, 4));
const monthOf = s => Number(String(s).slice(5, 7)) - 1;
function unpaidEntries() { return revenueEntries().filter(e => !e.paid && e.kind !== 'mow-import'); }
function clientStats(cid, year) {
  const c = S.clients[cid] || {};
  const es = revenueEntries().filter(e => e.clientId === cid);
  const inYear = es.filter(e => !year || yearOf(e.date) === year);
  let rev = inYear.reduce((a, e) => a + e.amount, 0);
  let mows = inYear.filter(e => e.kind === 'mow').length;
  if (!year || year === 2026) { rev += Number(c.importedMowRevenue) || 0; mows += Number(c.importedMows) || 0; }
  const unpaid = es.filter(e => !e.paid).reduce((a, e) => a + e.amount, 0);
  return { rev, mows, unpaid, entries: es };
}
function setEntryPaid(src, paid, invoiceId) {
  if (src.t === 'job') { const j = clone(S.jobs[src.id]); if (!j) return; j.paid = paid; if (invoiceId !== undefined) j.invoiceId = invoiceId; put('jobs', src.id, j); }
  else { const w = clone(S.weeks[src.w]); if (!w || !w.entries[src.cid]) return; w.entries[src.cid].paid = paid; if (invoiceId !== undefined) w.entries[src.cid].invoiceId = invoiceId; put('weeks', src.w, w); }
}
function docTotal(d) { const sub = (d.items || []).reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.rate) || 0), 0); const tax = sub * (Number(d.taxRate) || 0) / 100; return { sub: r2(sub), tax: r2(tax), total: r2(sub + tax) }; }
function nextNumber(coll, prefix) { let max = 0; for (const d of Object.values(S[coll])) { const m = String(d.number || '').match(/(\d+)$/); if (m) max = Math.max(max, Number(m[1])); } return `${prefix}-${String(max + 1).padStart(4, '0')}`; }
function years() { const ys = new Set([new Date().getFullYear()]); for (const e of revenueEntries()) if (e.date) ys.add(yearOf(e.date)); for (const e of Object.values(S.expenses)) if (e.date) ys.add(yearOf(e.date)); return [...ys].sort((a, b) => b - a); }
function clientLabel(c) { return c.address && c.address !== c.name ? `${c.name} — ${c.address}` : c.name; }
function findClientByLabel(v) { v = String(v || '').trim().toLowerCase(); if (!v) return null; for (const [id, c] of Object.entries(S.clients)) if (clientLabel(c).toLowerCase() === v || (c.name || '').toLowerCase() === v) return id; return null; }

// ---------- toast ----------
let toastT;
let toastUndo = null;

// ---------- OVERVIEW ----------
const VIEWS = {};
VIEWS.home = {
  shell: () => `<div class="vhead"><h2>Overview</h2><div class="toolbar"><label class="label" for="yearSel">Season</label><select class="inp" id="yearSel" data-f="year">${years().map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('')}</select></div></div>`,
  body() {

    const exp = Object.values(S.expenses).filter(e => yearOf(e.date) === Y);

    const byM = Array.from({ length: 12 }, () => ({ mow: 0, proj: 0, exp: 0 }));

    // by service

    const svcArr = Object.entries(svc).sort((a, b) => b[1] - a[1]).slice(0, 8); const svcMax = svcArr[0]?.[1] || 1;
    const svcHtml = svcArr.length ? `<div class="bars">${svcArr.map(([k, v]) => `<div class="bar-row"><span>${esc(k)}</span><b class="num">${money0(v)} <span class="muted small">${Math.round(v / (revT || 1) * 100)}%</span></b><div class="track"><div class="fill" style="width:${(v / svcMax * 100).toFixed(1)}%"></div></div></div>`).join('')}</div>` : `<div class="empty">No revenue logged for ${Y} yet.</div>`;

    // recent

    const recentHtml = recent.length ? `<div class="tbl-wrap"><table><tbody>${recent.map(e => `<tr><td class="muted num" style="white-space:nowrap">${fmtDate(e.date)}</td><td>${esc(e.clientName)}<div class="muted small">${esc(e.service)}</div></td><td class="r num">${money(e.amount)}<div>${e.paid ? '<span class="pill green">Paid</span>' : '<span class="pill warn">Unpaid</span>'}</div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Tick lawns on <b>This week</b> or log a job to see activity here.</div>`;

    return `${kpis}
      <section class="panel chart"><h3>Revenue by month <span class="muted">${Y}</span></h3><div id="chart">${chartSvg(byM)}</div>
      <div class="legend"><span><i style="background:var(--c-mow)"></i>Mowing</span><span><i style="background:var(--c-proj)"></i>Projects &amp; services</span><span><i style="background:var(--c-exp);height:3px;vertical-align:3px"></i>Expenses</span></div></section>

};
function normSvc(s) {
  s = String(s || 'Other').trim(); const l = s.toLowerCase();
  if (/aerat|overseed/.test(l) && /clean/.test(l)) return 'Cleanup + aeration';
  if (/aerat|overseed/.test(l)) return 'Aeration + overseeding';
  if (/clean/.test(l)) return 'Cleanups';
  if (/mulch/.test(l)) return 'Mulching';
  if (/hedge|bush|shrub|trim/.test(l)) return 'Hedges & bushes';
  if (/wash/.test(l)) return 'Pressure washing';
  if (/gutter/.test(l)) return 'Gutter cleaning';
  if (/stain|deck|fence|pergola|paint/.test(l)) return 'Deck, fence & pergola';
  if (/tree/.test(l)) return 'Tree work';
  if (/snow/.test(l)) return 'Snow removal';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function niceStep(max) { const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function chartSvg(byM) {
  const W = Math.max(320, Math.round(($('#vbody')?.clientWidth || 900) - 34)), H = 250, L = 52, R = 8, T = 12, B = 28;
  const tot = byM.map(m => m.mow + m.proj); const max = Math.max(1, ...tot, ...byM.map(m => m.exp));
  const step = niceStep(max); const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top); const cw = (W - L - R) / 12; const bw = Math.min(42, cw * .62);
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v >= 1000 ? '$' + (v / 1000) + 'k' : '$' + v}</text>`;
  byM.forEach((m, i) => {
    const x = L + cw * i + (cw - bw) / 2;
    const hm = y(0) - y(m.mow), hp = y(0) - y(m.proj);
    const tip = `${MONTHS_L[i]}: ${money0(m.mow + m.proj)} revenue (${money0(m.mow)} mowing, ${money0(m.proj)} projects), ${money0(m.exp)} expenses`;
    g += `<g><title>${tip}</title>`;
    if (m.mow) g += `<rect x="${x}" y="${y(m.mow)}" width="${bw}" height="${hm}" fill="var(--c-mow)"/>`;
    if (m.proj) g += `<rect x="${x}" y="${y(m.mow + m.proj)}" width="${bw}" height="${hp}" rx="3" fill="var(--c-proj)"/>`;
    if (m.exp) g += `<line x1="${x - 4}" x2="${x + bw + 4}" y1="${y(m.exp)}" y2="${y(m.exp)}" stroke="var(--c-exp)" stroke-width="3" stroke-linecap="round"/>`;
    g += `<rect x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent"/></g>`;
    g += `<text x="${L + cw * i + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MONTHS[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly revenue and expenses">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg>`;
}

// ---------- THIS WEEK ----------
function weekSummary(ws) {
  const doc = S.weeks[ws] || { entries: {} }; const prev = S.weeks[addDays(ws, -7)] || { entries: {} };
  const due = [], notDue = [], onCall = [], monthly = [];
  const carry = new Set(doc.carry || []), moved = new Set(doc.moved || []);
  const ordered = sortedClients().sort((a, b) => (a[1].route ?? 1e6) - (b[1].route ?? 1e6) || (a[1].name || '').localeCompare(b[1].name || ''));
  for (const [id, c] of ordered) {
    if (c.active === false) continue;
    if (moved.has(id) && !doc.entries?.[id]) { notDue.push(id); continue; }
    if (carry.has(id) && c.frequency !== 'weekly') { due.push(id); continue; }
    if (c.frequency === 'weekly') due.push(id);
    else if (c.frequency === 'biweekly') { const isDue = c.bwGroup ? c.bwGroup === weekGroup(ws) : !(prev.entries?.[id] && !doc.entries?.[id]); (isDue ? due : notDue).push(id); }
    else if (c.frequency === 'oncall') onCall.push(id);
    else if (c.frequency === 'monthly') monthly.push(id);
  }
  const extra = [...notDue, ...onCall].filter(id => doc.entries?.[id]).length;
  const earned = Object.values(doc.entries || {}).reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const potential = due.reduce((a, id) => a + (Number(S.clients[id].mowPrice) || 0), 0);
  return { doc, carry, moved, dueList: due, notDue, onCall, monthly, done: due.filter(id => doc.entries?.[id]).length + extra, due: due.length + extra, earned, potential };
}

      <p class="small muted">Ticking a lawn logs a mow at that client's price, dated ${ws === mondayOf(today()) ? 'today' : 'the Monday of that week'}. Revenue, monthly totals and the Overview update on their own. Change a price on the client's card.</p>`;
  }

function toggleMow(cid, wsArg, silent) {

  else { const c = S.clients[cid]; const t = today(); doc.entries[cid] = { amount: Number(c.mowPrice) || 0, paid: false, date: (t >= ws && t <= addDays(ws, 6)) ? t : ws, name: c.name, address: c.address || '' }; }

}

function markClientPaid(key) {
  const x = owedGroups().find(g => (g.cid || 'name:' + g.name) === key); if (!x) return;
  const before = x.es.map(e => ({ src: e.src, paid: e.paid }));
  // batch per document so each week doc gets one write
  const weeks = {};
  for (const e of x.es) { if (e.src.t === 'job') { const j = clone(S.jobs[e.src.id]); j.paid = true; put('jobs', e.src.id, j); } else { (weeks[e.src.w] = weeks[e.src.w] || clone(S.weeks[e.src.w])).entries[e.src.cid].paid = true; } }
  for (const [w, d] of Object.entries(weeks)) put('weeks', w, d);
  const invs = [...new Set(x.es.map(e => e.invoiceId).filter(Boolean))];
  const prevInv = {};
  for (const id of invs) { const inv = S.invoices[id]; if (inv && inv.status !== 'paid') { prevInv[id] = inv.status; put('invoices', id, Object.assign(clone(inv), { status: 'paid', paidOn: today() })); } }
  renderBody();
  toast(`${x.name}: ${money(x.total)} marked paid`, false, () => {
    const wk = {};
    for (const b of before) { if (b.src.t === 'job') { const j = clone(S.jobs[b.src.id]); if (j) { j.paid = false; put('jobs', b.src.id, j); } } else { const d = wk[b.src.w] || (wk[b.src.w] = clone(S.weeks[b.src.w])); if (d?.entries?.[b.src.cid]) d.entries[b.src.cid].paid = false; } }
    for (const [w, d] of Object.entries(wk)) if (d) put('weeks', w, d);

    renderBody();
  });
}

const DIFF = [['easy', 'Easy', -0.1], ['normal', 'Normal', 0], ['hard', 'Hard', 0.15], ['vhard', 'Very hard', 0.3]];
const calcRates = () => Object.assign({ rate: Number(settings().targetRate) || 60, wage: 20, markup: 20, minimum: 100, fuel: 10, travelMin: 20, round: 5, premium: 15 }, S.settings.calc || {});
let CALC = null;

  renderCalc(); if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }

function pastFor(service) {
  const k = normSvc(service); const js = Object.values(S.jobs).filter(j => !isMowKind(j.kind) && normSvc(j.service) === k && Number(j.amount) > 0);
  if (!js.length) return null;
  const a = js.map(j => Number(j.amount)).sort((x, y) => x - y); const hrs = js.filter(j => Number(j.hours) > 0);
  return { n: a.length, min: a[0], max: a.at(-1), avg: a.reduce((s, v) => s + v, 0) / a.length, med: a.at(Math.floor(a.length / 2)), perHour: hrs.length ? hrs.reduce((s, j) => s + Number(j.amount), 0) / hrs.reduce((s, j) => s + Number(j.hours), 0) : null, recent: js.sort((x, y) => (y.date || '').localeCompare(x.date || '')).slice(0, 3) };
}
function calcResult() {
  const R = calcRates(), c = CALC; const crew = Math.max(1, Number(c.crew) || 1), hrs = Math.max(0, Number(c.hours) || 0), travel = Math.max(0, Number(c.travelMin) || 0) / 60;
  const crewHours = crew * hrs + crew * travel;
  const labour = crewHours * R.rate;
  const matCost = c.materials.reduce((s, m) => s + (Number(m.cost) || 0), 0); const matPrice = matCost * (1 + R.markup / 100);
  const pass = (Number(c.dump) || 0) + (Number(c.rental) || 0);

const BACKUP_COLLS = ['clients', 'jobs', 'weeks', 'expenses', 'quotes', 'invoices', 'crew', 'shifts', 'weekplans'];
function fullBackup() { const out = { app: 'bnb-hq', version: 1, exportedAt: new Date().toISOString(), collections: {} }; BACKUP_COLLS.forEach(c => out.collections[c] = clone(S[c])); out.collections.settings = { business: clone(S.settings) }; return out; }
async function restoreBackup(obj) {
  if (!obj || !obj.collections) { toast('That file isn\'t a B&B CO. HQ backup.', true); return; }
  const jobs = []; for (const [c, docs] of Object.entries(obj.collections)) { if (![...BACKUP_COLLS, 'settings'].includes(c)) continue; for (const [id, d] of Object.entries(docs || {})) if (d && typeof d === 'object') jobs.push([c, id, d]); }
  let done = 0, failed = 0; toast(`Restoring ${jobs.length} records…`);
  const worker = async () => { while (jobs.length) { const [c, id, d] = jobs.shift(); try { await S.db.doc(`${c}/${id}`).set(d); } catch (e) { failed++; } done++; if (done % 25 === 0) toast(`Restored ${done} records…`); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  toast(failed ? `Restored ${done - failed} records, ${failed} failed. Try again.` : `Restored ${done} records`, !!failed);
}

const LOCK = { entry: '', fails: 0, until: 0, last: Date.now(), busy: false };

function isLocked() { return !$('#lock').hidden; }

function initLock() {

}
async function pressKey(k) {

  if (LOCK.entry.length >= 4) return;
  LOCK.entry += k; renderDots();
  if (LOCK.entry.length < 4) return;
  LOCK.busy = true;
  const ok = (await sha(S.settings.pin.salt + LOCK.entry)) === S.settings.pin.hash;
  LOCK.busy = false;
  if (ok) { LOCK.fails = 0; hideLock(); return; }
  LOCK.fails++; LOCK.entry = '';
  const dots = $('#lockDots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); setTimeout(renderDots, 250);
  if (LOCK.fails >= 5) {
    LOCK.until = Date.now() + 30000; LOCK.fails = 0; document.querySelectorAll('#keypad button').forEach(b => b.disabled = true);
    const tick = () => { const left = Math.ceil((LOCK.until - Date.now()) / 1000); if (left <= 0) { $('#lockMsg').textContent = 'Enter your passcode'; document.querySelectorAll('#keypad button').forEach(b => b.disabled = false); return; } $('#lockMsg').textContent = `Too many tries. Wait ${left}s`; setTimeout(tick, 500); }; tick();

    case 'qStatus': { const d = clone(S.quotes[id]); const prev = d.status; d.status = a.dataset.s; put('quotes', id, d); renderBody(); toast(`${d.clientName}: ${d.status === 'accepted' ? 'booked' : 'declined'}`, false, () => { put('quotes', id, Object.assign(clone(S.quotes[id]), { status: prev })); renderBody(); }); break; }
    case 'quoteJob': { const d = S.quotes[id]; jobDialog(null, { clientId: d.clientId, clientName: d.clientName, service: (d.items || [])[0]?.desc || '', amount: docTotal(d).sub }); break; }
    case 'saveNextPrices': { let n = 0; for (const [cid, c] of sortedClients()) { if (c.active === false || !['weekly', 'biweekly', 'monthly', 'oncall'].includes(c.frequency)) continue; const np = proposedPrice(c); if (np !== Number(c.mowPrice) && np !== c.nextPrice) { put('clients', cid, Object.assign(clone(c), { nextPrice: np })); n++; } } toast(n ? `Saved next season's price for ${n} clients` : 'No price changes to save'); renderBody(); break; }
    case 'applyNextPrices': { let n = 0; for (const [cid, c] of sortedClients()) if (c.nextPrice) { const nc = clone(c); nc.mowPrice = c.nextPrice; delete nc.nextPrice; put('clients', cid, nc); n++; } toast(`${n} clients switched to new prices`); renderBody(); break; }
    case 'priceMsg': { const c = S.clients[id]; try { await navigator.clipboard.writeText(priceMessage(c, Number(a.dataset.p))); toast(`Price message for ${c.name} copied`); } catch (err) { toast('Copy did not work in this browser.', true); } break; }
    case 'routeOrder': routeDialog(); break;
    case 'routeMove': routeMove(id, Number(a.dataset.d)); break;
    case 'rainDay': rainDay(); break;
    case 'csvTax': { const t = taxData(S.year); const rows = [['Line', 'Amount'], ['Gross business income', r2(t.rev)], ...(t.hst ? [['HST collected', r2(t.hst)]] : []), ...t.lines.map(([k, v]) => [k, r2(v)]), ['Total expenses', r2(t.exp)], ['Net income', r2(t.net)]]; offerFile(`B&B CO. tax summary ${S.year}.csv`, csv(rows)); break; }
    case 'newWorker': workerDialog(null); break;
    case 'openWorker': workerDialog(id); break;
    case 'newShift': shiftDialog(null); break;
    case 'openShift': shiftDialog(id); break;
    case 'payWorker': e.stopPropagation(); payWorker(id); break;
    case 'delWorker': del('crew', id); closeDlg(); toast('Worker deleted'); renderBody(); break;
    case 'delShift': del('shifts', id); closeDlg(); toast('Shift deleted'); renderBody(); break;
    case 'wkPrev': S.weekStart = addDays(S.weekStart, -7); renderBody(); break;
    case 'wkNext': S.weekStart = addDays(S.weekStart, 7); renderBody(); break;
    case 'wkToday': S.weekStart = mondayOf(today()); renderBody(); break;
    case 'toggleFront': { e.stopPropagation(); const d = clone(S.weeks[S.weekStart]); const en = d.entries[id]; const c = S.clients[id] || {}; if (en.invoiceId) { toast('That mow is on an invoice already.', true); break; } en.front = !en.front; en.amount = en.front ? (Number(c.frontPrice) || en.amount) : (Number(c.mowPrice) || en.amount); put('weeks', S.weekStart, d); renderBody(); toast(en.front ? `Front only · ${money0(en.amount)}` : `Full cut · ${money0(en.amount)}`); break; }
    case 'toggleMowPaid': { e.stopPropagation(); const d = clone(S.weeks[S.weekStart]); d.entries[id].paid = !d.entries[id].paid; put('weeks', S.weekStart, d); renderBody(); break; }
    case 'toggleMow': toggleMow(id); break;
    case 'tickAll': { const ws = S.weekStart, doc = clone(S.weeks[ws]) || { entries: {} }; doc.entries = doc.entries || {}; const t = today(); const date = (t >= ws && t <= addDays(ws, 6)) ? t : ws; let n = 0;
      for (const cid of weekSummary(ws).dueList) if (!doc.entries[cid]) { const c = S.clients[cid]; doc.entries[cid] = { amount: Number(c.mowPrice) || 0, paid: false, date, name: c.name, address: c.address || '' }; n++; }
      put('weeks', ws, doc); toast(`${n} lawns marked done`); renderBody(); break; }
    case 'toggleSubPaid': { e.stopPropagation(); const jid = `sub_${id}_${S.weekStart.slice(0, 7)}`; const j = clone(S.jobs[jid]); j.paid = !j.paid; put('jobs', jid, j); renderBody(); break; }
    case 'toggleSub': { const ym = S.weekStart.slice(0, 7), jid = `sub_${id}_${ym}`; const c = S.clients[id];
      if (S.jobs[jid]) { if (S.jobs[jid].invoiceId) { toast('That charge is on an invoice. Remove it from the invoice first.', true); break; } del('jobs', jid); }
      else put('jobs', jid, { date: ym + '-01', clientId: id, clientName: c.name, address: c.address || '', service: `Lawn care plan — ${MONTHS_L[monthOf(ym + '-01')]}`, amount: Number(c.mowPrice) || 0, paid: false, kind: 'sub', notes: '' });
      renderBody(); break; }
    case 'togglePaid': { e.stopPropagation(); const en = entryByKey(a.dataset.key); if (en) { setEntryPaid(en.src, !en.paid); renderBody(); } break; }
    case 'openEntry': { const en = entryByKey(a.dataset.key); if (!en) break; if (en.src.t === 'job') jobDialog(en.src.id); else mowDialog(en.src.w, en.src.cid); break; }
    case 'newJob': jobDialog(null); break;
    case 'jobFor': jobDialog(null, { clientId: id }); break;
    case 'openClient': clientDialog(id); break;
    case 'newClient': clientDialog(null); break;
    case 'newExpense': expenseDialog(null); break;
    case 'openExpense': expenseDialog(id); break;
    case 'newQuote': docDialog('quotes', null); break;
    case 'quoteFor': docDialog('quotes', null, { clientId: id, clientName: S.clients[id]?.name, address: S.clients[id]?.address }); break;
    case 'newInvoice': docDialog('invoices', null); break;
    case 'openInvoice': docDialog('invoices', id); break;
    case 'openQuote': docDialog('quotes', id); break;
    case 'invoiceUnpaid': { const c = S.clients[id]; const es = clientStats(id, null).entries.filter(x => !x.paid && !x.invoiceId).sort((x, y) => x.date.localeCompare(y.date));
      if (!es.length) { toast('Those unpaid jobs are already on an invoice.', true); break; }
      docDialog('invoices', null, { clientId: id, clientName: c.name, address: c.address, items: itemsFromEntries(es), refs: es.map(x => x.src) });
      ED.pendingRefs = true; break; }
    case 'addItem': readItems(); ED.doc.items.push({ desc: '', qty: 1, rate: '' }); renderItems(); $('#itemRows .item:last-child input')?.focus(); break;
    case 'rmItem': readItems(); ED.doc.items.splice(Number(a.dataset.i), 1); if (!ED.doc.items.length) ED.doc.items.push({ desc: '', qty: 1, rate: '' }); renderItems(); break;
    case 'docPdf': { if (!$('#d_client').value.trim()) { toast('Pick a client first.', true); break; } const d = collectDoc();
      try { const blob = buildPdf(ED.coll, d); await offerFile(`${d.number} ${d.clientName}.pdf`.replace(/[\\/:*?"<>|]/g, ''), blob); } catch (err) { toast('The PDF maker did not load. Check your connection and reopen the page.', true); } break; }
    case 'docMsg': { const d = collectDoc(); $('#msgText').value = docMessage(ED.coll, d); $('#msgArea').hidden = false; $('#msgText').focus(); break; }
    case 'copyMsg': { const t = $('#msgText'); try { await navigator.clipboard.writeText(t.value); toast('Message copied'); } catch (err) { t.select(); toast('Press Ctrl+C or ⌘C to copy'); } break; }
    case 'quoteToInvoice': { if (!saveDoc()) break; const q = clone(ED.doc); q.status = 'accepted'; put('quotes', ED.id, q);
      docDialog('invoices', null, { clientId: q.clientId, clientName: q.clientName, address: q.address, items: q.items, taxRate: q.taxRate, notes: '', fromQuote: q.number }); toast('Quote accepted. Review and save the invoice.'); break; }
    case 'askConfirm': $('#confirmBar').hidden = false; break;
    case 'cancelConfirm': $('#confirmBar').hidden = true; break;
    case 'delJob': del('jobs', id); closeDlg(); toast('Job deleted'); renderBody(); break;
    case 'delMow': { const [w, cid] = id.split('|'); const d = clone(S.weeks[w]); delete d.entries[cid]; if (!weekEmpty(d)) put('weeks', w, d); else del('weeks', w); closeDlg(); toast('Mow removed'); renderBody(); break; }
    case 'delClient': del('clients', id); closeDlg(); toast('Client deleted'); renderBody(); break;
    case 'delExpense': del('expenses', id); closeDlg(); toast('Expense deleted'); renderBody(); break;
    case 'delDoc': { const d = S[ED.coll][id]; if (ED.coll === 'invoices' && d?.refs) d.refs.forEach(src => setEntryPaid(src, src.t === 'job' ? !!S.jobs[src.id]?.paid : !!S.weeks[src.w]?.entries?.[src.cid]?.paid, '')); del(ED.coll, id); closeDlg(); toast('Deleted'); renderBody(); break; }
    case 'closeDlg': closeDlg(); break;
    case 'csvJobs': { const rows = [['Date', 'Client', 'Address', 'Service', 'Type', 'Amount', 'Paid']]; revenueEntries().sort((x, y) => x.date.localeCompare(y.date)).forEach(x => rows.push([x.date, x.clientName, x.address, x.service, x.kind, x.amount, x.paid ? 'Yes' : 'No'])); offerFile(`B&B CO. jobs ${today()}.csv`, csv(rows)); break; }
    case 'csvExpenses': { const rows = [['Date', 'Category', 'Description', 'Amount']]; Object.values(S.expenses).sort((x, y) => x.date.localeCompare(y.date)).forEach(x => rows.push([x.date, x.category, x.description, x.amount])); offerFile(`B&B CO. expenses ${today()}.csv`, csv(rows)); break; }
    case 'csvClients': { const rows = [['Name', 'Address', 'Phone', 'Email', 'Plan', 'Price', 'Active', 'Notes']]; sortedClients().forEach(([, c]) => rows.push([c.name, c.address, c.phone, c.email, FREQ[c.frequency], c.mowPrice, c.active !== false ? 'Yes' : 'No', c.notes])); offerFile(`B&B CO. clients ${today()}.csv`, csv(rows)); break; }
  }
});
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.matches('.lawn')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => { const k = e.target.dataset?.f; if (!k || k === 'year' || e.target.type === 'checkbox') return; S.f[k] = e.target.value; scheduleRender(); });
document.addEventListener('change', e => {
  if (e.target.dataset?.minutes) { const cid = e.target.dataset.minutes; const c = clone(S.clients[cid]); c.mowMinutes = Number(e.target.value) || 0; put('clients', cid, c); renderBody(); return; }
  if (e.target.id === 'targetRate') { const d = Object.assign({}, S.settings, { targetRate: Number(e.target.value) || 60 }); S.settings = d; save('settings/business', d); renderBody(); return; }
  const k = e.target.dataset?.f; if (!k) return; if (k === 'year') { S.year = Number(e.target.value); renderBody(); return; } S.f[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; renderBody(); });
document.addEventListener('submit', e => { if (e.target.id !== 'setForm') return; e.preventDefault();
  const v = id => $('#s_' + id).value.trim();
  const data = Object.assign({}, S.settings, { goalYear: Number(v('goalYear')) || 0, goalMonth: Number(v('goalMonth')) || 0, businessName: v('businessName') || 'B&B CO.', tagline: v('tagline'), phone: v('phone'), email: v('email'), etransfer: v('etransfer'), address: v('address'), hst: v('hst'), taxRate: Number(v('taxRate')) || 0, terms: v('terms'), services: v('services') });
  S.settings = data; save('settings/business', data); toast('Settings saved'); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'home') { const el = $('#chart'); if (el) renderBody(); } }, 200); });

// ---------- boot ----------
S.view = 'home'; try { const v = localStorage.getItem('bnb.view2'); if (v && VIEWS[v]) S.view = v; } catch (e) {}
document.querySelectorAll('[data-go]').forEach(b => { if (b.dataset.go === S.view) b.setAttribute('aria-current', 'page'); });
function fail(msg) { $('#boot').innerHTML = `<h2>Can't load your data here</h2><p>${msg}</p>`; }
(async () => {
  const db = await claude.use('db');
  if (!db) { fail('Open this page in Claude while signed in to the account that owns it.'); return; }
  S.db = db;
  const onErr = err => { if (err && err.code === 'revoked') fail('Access to this data was turned off.'); else toast('Lost the live connection. Reload the page to reconnect.', true); };
  const sub = coll => db.collection(coll).limit(1000).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S[coll] = o; const first = !S.loaded.has(coll); S.loaded.add(coll); if (first && ready()) { renderShell(); } scheduleRender(); }, onErr);
  ['clients', 'jobs', 'weeks', 'expenses', 'quotes', 'invoices', 'crew', 'shifts', 'weekplans'].forEach(sub);
  db.doc('settings/business').onSnapshot(snap => { S.settings = snap.exists ? clone(snap.data()) : {}; const first = !S.loaded.has('settings'); if (first) initLock(); else updateLockBtn(); S.loaded.add('settings'); if (first && ready()) renderShell(); if (S.view !== 'settings') scheduleRender(); }, onErr);
  setTimeout(() => { if (!ready()) $('#boot').querySelector('p').textContent = 'Still connecting… if this takes long, reload the page.'; }, 8000);
})();
// re-render shell lists (months, years) when underlying data changes, but never while the user types in them
VIEWS.jobs.refreshShell = VIEWS.costs.refreshShell = VIEWS.home.refreshShell = function () { const a = document.activeElement; if (a && $('#vshell').contains(a) && a.matches('input,textarea')) return; const pos = a && a.id; $('#vshell').innerHTML = VIEWS[S.view].shell(); if (pos) { const el = document.getElementById(pos); if (el) { el.focus(); } } };
})();

</script>

<script type="module" src="firebase-shim.js"></script>
